
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | BrandShield AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body id="dashboard-page" data-auth-required="true">
  <header class="navbar">
    <a class="logo" href="index.html"><img src="images/cyber-parrot.svg" width="34" height="34" alt="" style="vertical-align:middle;filter:drop-shadow(0 0 7px #18e0cf)"> BrandShield<span> AI</span></a>
    <nav class="nav-links">
      <a class="active" href="dashboard.html">Dashboard</a>
      <a href="monitoring.html">Monitoring</a>
      <a href="threats.html">Threats</a>
      <a href="reports.html">Reports</a>
      <a href="settings.html">Settings</a>
      <span id="user-email"></span>
      <button id="sign-out" type="button">Sign out</button>
    </nav>
  </header>

  <main class="section container">
    <div class="section-heading">
      <p class="eyebrow">OVERVIEW</p>
      <h1>Security Dashboard</h1>
      <p class="muted">Summary of your saved scans and findings.</p>
    </div>

    <p id="auth-message" class="notice" role="status"></p>

    <div class="grid">
      <article class="card">
        <p class="stat-label">Monitored Brands</p>
        <div class="stat-value" id="total-brands">—</div>
      </article>
      <article class="card">
        <p class="stat-label">Saved Findings</p>
        <div class="stat-value" id="total-threats">—</div>
      </article>
      <article class="card">
        <p class="stat-label">Needs Review</p>
        <div class="stat-value" id="open-threats">—</div>
      </article>
    </div>

    <section class="section">
      <div class="section-heading">
        <h2>Recent scan leads</h2>
        <a class="button" href="threats.html">Review findings</a>
      </div>
      <div class="card" id="recent-threats">Loading...</div>
    </section>

    <a class="button" href="monitoring.html">+ Add a brand</a>
  </main>

  <footer>BrandShield AI · Your monitoring workspace</footer>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
