
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | BrandShield AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="logo" href="index.html">🛡 BrandShield<span> AI</span></a>
    <h1>Create an account</h1>
    <p class="muted">Your brands and scan results are stored in your account.</p>

    <form id="register-form" data-auth-form="register">
      <label for="email">Email address</label>
      <input id="email" type="email" maxlength="320" required autocomplete="email">
      <label for="password">Password (12–128 characters)</label>
      <input id="password" type="password" minlength="12" maxlength="128"
        required autocomplete="new-password">
      <button type="submit">Create Account</button>
    </form>

    <p id="message" role="status"></p>
    <p class="muted">Account registration does not include email verification or password reset yet.</p>
    <p class="muted">Already registered? <a class="accent" href="login.html">Sign in</a></p>
    <a class="accent" href="index.html">← Back to home</a>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth-forms.js"></script>
</body>
</html>
